name: Build and deploy to GitHub Pages

# The live site is always built from main. If a branch named "next" exists,
# it is built too and served beside it under /next/ as a design preview,
# so a new version can be compared with the current one before it replaces it.
on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve site URL
        # User site (repo named <owner>.github.io) is served from the root,
        # any other repo from https://<owner>.github.io/<repo>/
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "SITE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi
      - name: Build and check
        run: npm test
      - name: Build the design preview from branch next (if it exists)
        run: |
          if git ls-remote --exit-code --heads origin next >/dev/null; then
            git fetch --depth 1 origin next
            git worktree add _next FETCH_HEAD
            cd _next
            npm ci
            BASE_PATH="$BASE_PATH/next" PREVIEW=1 npx astro build
            cd ..
            mkdir -p dist/next
            cp -r _next/dist/. dist/next/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
